[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scholar-rag"
version = "0.1.0"
description = "Agentic RAG research assistant with citations, arXiv fallback, and LLM-as-judge evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "pypdf>=4.2",
    "openai>=1.30",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "streamlit>=1.36",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
scholar = "scholar_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
